# Unsigned release .ipa for sideloading (no Apple Developer account needed to build).
# The output must be signed on install, e.g. with Sideloadly or AltStore and a free Apple ID.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
# `build` runs npm dependencies with a read-only token; only `release` can write to the repo.
# Actions are pinned to commit SHAs (the tag they were taken from is in the comment).
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ios/ is generated from app.json and config plugins (Continuous Native Generation)
      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean

      - name: Archive without signing
        run: |
          # the project is named after app.json "name" without spaces ("AI Usage" -> AIUsage)
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|\*\* ARCHIVE" || true
          ls -d "$ARCHIVE"/Products/Applications/*.app

      - name: Package the .ipa
        run: |
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          VERSION=$(node -p "require('./app.json').expo.version")
          APP=$(ls -d "$ARCHIVE"/Products/Applications/*.app | head -1)
          # main Info.plist and executable first: some sideloading tools only scan the head of
          # the archive for the main bundle (see scripts/package-ipa.py)
          python3 scripts/package-ipa.py "$APP" "$RUNNER_TEMP/AIUsage-$VERSION-unsigned.ipa"
          echo "IPA=$RUNNER_TEMP/AIUsage-$VERSION-unsigned.ipa" >> "$GITHUB_ENV"
          ls -lh "$RUNNER_TEMP"/*.ipa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AIUsage-unsigned-ipa
          path: ${{ env.IPA }}
          retention-days: 30

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

  # a v* tag publishes a GitHub Release; the Android workflow attaches its .apk to the same one
  # release notes = this version's changelog (.github/changes/<tag>.md) + the install guide
  release:
    needs: ipa
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AIUsage-unsigned-ipa
          path: dist

      - name: Compose release notes
        run: |
          {
            if [ -f ".github/changes/${GITHUB_REF_NAME}.md" ]; then
              cat ".github/changes/${GITHUB_REF_NAME}.md"
              echo
            fi
            cat .github/release-notes.md
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: AI Usage ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/*.ipa
