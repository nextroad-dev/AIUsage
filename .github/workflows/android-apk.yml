# Release .apk that installs directly on Android (no store account needed).
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
#
# The APK is signed with the project's own release key, kept in repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Never sign with the Expo template's debug key: it is public, so anyone could ship an "update"
# that Android accepts over this app and that inherits its data.
#
# Three jobs keep the blast radius small: `build` runs npm dependencies with a read-only token and
# no secrets; `sign` sees the key but runs no project code; only `release` can write to the repo.
# Actions are pinned to commit SHAs (the tag they were taken from is in the comment).
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: 17

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # android/ is generated from app.json and config plugins (Continuous Native Generation)
      - name: Generate the native project
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # the template signs this with its debug key; `sign` replaces that signature
      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # plugins/with-abi-splits.js makes Gradle write one APK per CPU family plus a universal one
      - name: Name the APKs
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          OUT=android/app/build/outputs/apk/release
          mkdir apks
          for ABI in arm64-v8a armeabi-v7a universal; do
            cp "$OUT/app-$ABI-release.apk" "apks/AIUsage-$VERSION-$ABI.apk"
          done
          ls -lh apks/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-apk
          path: apks/*.apk
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-apk

      - name: Sign with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing (see the top of android-apk.yml). Refusing to publish a debug-signed APK."
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          # tolerate line breaks a Windows shell may have added when the secret was set
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE"
          mkdir signed
          for APK in AIUsage-*.apk; do
            "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            # apksigner drops the debug signature and signs v1-v3 with the release key
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "signed/$APK" "$RUNNER_TEMP/aligned.apk"
            if "$BUILD_TOOLS/apksigner" verify --print-certs "signed/$APK" | grep -q "CN=Android Debug"; then
              echo "::error::$APK is still signed with a debug certificate."
              exit 1
            fi
          done
          rm -f "$KEYSTORE"
          CERTS=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs signed/*-universal.apk)
          {
            echo "### APK signing certificate"
            echo '```'
            echo "$CERTS" | grep -E "certificate (DN|SHA-256 digest)"
            echo '```'
            echo '### Files'
            echo '```'
            (cd signed && sha256sum *.apk)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh signed/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AIUsage-android-apk
          path: signed/*.apk
          retention-days: 30

  # a v* tag publishes a GitHub Release; the iOS workflow attaches its .ipa to the same one
  # release notes = this version's changelog (.github/changes/<tag>.md) + the install guide
  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AIUsage-android-apk
          path: dist

      - name: Compose release notes
        run: |
          {
            if [ -f ".github/changes/${GITHUB_REF_NAME}.md" ]; then
              cat ".github/changes/${GITHUB_REF_NAME}.md"
              echo
            fi
            cat .github/release-notes.md
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: AI Usage ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/*.apk
